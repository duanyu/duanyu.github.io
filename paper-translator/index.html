<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="pageTitle">论文翻译 | Paper Translator</title>

    <!-- ============================================================ -->
    <!--  样式表：CSS 变量集中管理，方便后续换肤 / 调整风格           -->
    <!-- ============================================================ -->
    <style>
        /* ---------- 全局变量 ---------- */
        :root {
            --bg:           #fafafa;
            --text:         #333333;
            --text-light:   #777777;
            --accent:       #1a1a2e;
            --card-bg:      #ffffff;
            --card-shadow:  0 2px 12px rgba(0, 0, 0, 0.06);
            --card-hover:   0 4px 20px rgba(0, 0, 0, 0.10);
            --radius:       12px;
            --max-width:    880px;
            --tag-bg:       #eef2ff;
            --tag-color:    #4f46e5;
        }

        /* ---------- 基础重置 ---------- */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                         sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            display: flex;
            justify-content: center;
            padding: 32px 20px 80px;
        }

        .container { width: 100%; max-width: var(--max-width); }

        /* ============================================================
           顶部栏：返回主页 + 标题 + 语言切换
           ============================================================ */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-link {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        .site-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
        }

        /* 语言切换按钮 */
        .lang-switch {
            display: flex;
            gap: 4px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 3px;
            box-shadow: var(--card-shadow);
        }
        .lang-switch button {
            border: none;
            background: transparent;
            padding: 6px 14px;
            border-radius: 17px;
            cursor: pointer;
            font-size: 0.85rem;
            color: var(--text-light);
            transition: all 0.2s;
        }
        .lang-switch button.active {
            background: var(--accent);
            color: #fff;
        }

        /* ============================================================
           搜索栏
           ============================================================ */
        .search-section {
            margin-bottom: 32px;
        }
        .search-wrapper {
            position: relative;
            max-width: 480px;
        }
        .search-wrapper input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: var(--radius);
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        .search-wrapper input:focus { border-color: var(--accent); }
        .search-wrapper .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
        }
        .search-hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 6px;
        }

        /* ============================================================
           统计信息
           ============================================================ */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        /* ============================================================
           论文卡片列表
           ============================================================ */
        .paper-list { display: flex; flex-direction: column; gap: 16px; }

        .paper-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--card-shadow);
            transition: box-shadow 0.25s, transform 0.25s;
        }
        .paper-card:hover {
            box-shadow: var(--card-hover);
            transform: translateY(-2px);
        }

        .paper-card .paper-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 6px;
        }

        .paper-card .paper-meta {
            font-size: 0.85rem;
            color: var(--text-light);
            margin-bottom: 10px;
        }

        /* 关键词标签 */
        .paper-card .paper-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }
        .paper-card .paper-tags .tag {
            display: inline-block;
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 10px;
            background: var(--tag-bg);
            color: var(--tag-color);
        }

        /* 操作按钮 */
        .paper-card .paper-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .paper-card .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-preview {
            background: var(--accent);
            color: #fff;
        }
        .btn-preview:hover { opacity: 0.85; }
        .btn-download {
            background: #f3f4f6;
            color: var(--text);
        }
        .btn-download:hover { background: #e5e7eb; }

        /* ============================================================
           PDF 预览弹窗
           ============================================================ */
        .preview-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .preview-overlay.show {
            display: flex;
        }
        .preview-modal {
            background: #fff;
            border-radius: var(--radius);
            width: 100%;
            max-width: 900px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
        }
        .preview-header .preview-title {
            font-weight: 600;
            color: var(--accent);
            font-size: 1rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 70%;
        }
        .preview-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            padding: 0 8px;
            line-height: 1;
        }
        .preview-close:hover { color: var(--text); }
        .preview-body {
            flex: 1;
            min-height: 0;
        }
        .preview-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ============================================================
           空状态
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* ============================================================
           页脚
           ============================================================ */
        .footer {
            text-align: center;
            font-size: 0.8rem;
            color: #ccc;
            margin-top: 56px;
        }
        .footer a { color: #bbb; text-decoration: none; }
        .footer a:hover { color: var(--accent); }

        /* ---------- 响应式 ---------- */
        @media (max-width: 600px) {
            body { padding: 24px 14px 60px; }
            .top-bar { flex-direction: column; align-items: flex-start; }
            .site-title { font-size: 1.25rem; }
            .paper-card { padding: 18px; }
            .preview-modal { height: 95vh; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ============================================================ -->
    <!--  顶部栏：返回链接 + 标题 + 语言切换                           -->
    <!-- ============================================================ -->
    <div class="top-bar">
        <a class="back-link" href="../" data-i18n="backHome">← 返回主页</a>
        <h1 class="site-title" data-i18n="siteTitle">📄 论文翻译</h1>
        <div class="lang-switch">
            <button id="btn-zh" class="active" onclick="switchLang('zh')">中文</button>
            <button id="btn-en" onclick="switchLang('en')">EN</button>
        </div>
    </div>

    <!-- ============================================================ -->
    <!--  搜索栏                                                     -->
    <!-- ============================================================ -->
    <div class="search-section">
        <div class="search-wrapper">
            <input type="text" id="searchInput"
                   data-i18n-placeholder="searchPlaceholder"
                   placeholder="搜索论文标题、作者、关键词..."
                   oninput="filterPapers()">
            <span class="search-icon">🔍</span>
        </div>
        <p class="search-hint" data-i18n="searchHint">支持按标题、作者、关键词检索</p>
    </div>

    <!-- ============================================================ -->
    <!--  统计信息                                                   -->
    <!-- ============================================================ -->
    <div class="stats-bar">
        <span id="statsText" data-i18n="stats">共 1 篇论文</span>
    </div>

    <!-- ============================================================ -->
    <!--  论文列表容器                                               -->
    <!-- ============================================================ -->
    <div id="paperList" class="paper-list">
        <!-- JS 动态渲染 -->
    </div>

    <!-- ============================================================ -->
    <!--  空状态（搜索无结果时显示）                                  -->
    <!-- ============================================================ -->
    <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-icon">📭</div>
        <p data-i18n="emptyResult">没有找到匹配的论文，试试其他关键词吧</p>
    </div>

    <!-- ============================================================ -->
    <!--  页脚                                                       -->
    <!-- ============================================================ -->
    <footer class="footer">
        <p>
            © 2026 Duan Yu ·
            Powered by
            <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a>
        </p>
    </footer>

</div><!-- .container -->

<!-- ================================================================ -->
<!--  PDF 预览弹窗                                                    -->
<!-- ================================================================ -->
<div id="previewOverlay" class="preview-overlay" onclick="closePreview(event)">
    <div class="preview-modal" onclick="event.stopPropagation()">
        <div class="preview-header">
            <span class="preview-title" id="previewTitle"></span>
            <button class="preview-close" onclick="closePreview()">&times;</button>
        </div>
        <div class="preview-body" id="previewBody">
            <iframe id="previewFrame" src="" allowfullscreen></iframe>
        </div>
    </div>
</div>

<!-- ================================================================ -->
<!--  JavaScript: 国际化 + 数据 + 搜索 + 渲染 + 预览                  -->
<!-- ================================================================ -->
<script>
    // =============================================================
    //  国际化文本 (i18n)
    // =============================================================
    const i18n = {
        zh: {
            pageTitle:       "论文翻译 | Paper Translator",
            siteTitle:       "📄 论文翻译",
            backHome:        "← 返回主页",
            searchPlaceholder: "搜索论文标题、作者、关键词...",
            searchHint:      "支持按标题、作者、关键词检索",
            stats:           "共 {count} 篇论文",
            emptyResult:     "没有找到匹配的论文，试试其他关键词吧",
            btnPreview:      "预览",
            btnDownload:     "下载 PDF",
            noResults:       "没有找到匹配的论文",
        },
        en: {
            pageTitle:       "Paper Translator | 论文翻译",
            siteTitle:       "📄 Paper Translator",
            backHome:        "← Back to Home",
            searchPlaceholder: "Search by title, author, keywords...",
            searchHint:      "Search by title, author, or keywords",
            stats:           "{count} paper(s) in total",
            emptyResult:     "No matching papers found. Try other keywords.",
            btnPreview:      "Preview",
            btnDownload:     "Download PDF",
            noResults:       "No matching papers found",
        }
    };

    let currentLang = "zh";

    // =============================================================
    //  论文数据（新增论文只需在此数组中添加对象即可）
    //  字段说明：
    //    - filename:   pdf/ 目录下的文件名
    //    - title:      { zh, en } 双语标题
    //    - authors:    作者
    //    - keywords:   { zh, en } 双语关键词数组
    //    - abstract:   { zh, en } 双语摘要（可选）
    // =============================================================
    const papers = [
        {
            id: 1,
            filename: "DeepSeekMath-V2: Towards Self-Verifiable Mathematical Reasoning.pdf",
            title: {
                zh: "DeepSeekMath-V2：面向自验证数学推理",
                en: "DeepSeekMath-V2: Towards Self-Verifiable Mathematical Reasoning"
            },
            authors: "Zhihong Shao, Peiyi Wang, et al.",
            keywords: {
                zh: ["数学推理", "自验证", "大语言模型", "强化学习", "DeepSeek"],
                en: ["Mathematical Reasoning", "Self-Verification", "LLM", "Reinforcement Learning", "DeepSeek"]
            },
            abstract: {
                zh: "本文提出了 DeepSeekMath-V2，一个面向自验证数学推理的大语言模型，通过强化学习与验证机制提升数学推理能力。",
                en: "This paper proposes DeepSeekMath-V2, a large language model towards self-verifiable mathematical reasoning, improving mathematical reasoning through reinforcement learning and verification mechanisms."
            }
        }
        // ---- 新增论文模板：复制以下代码块，填入信息即可 ----
        /*
        {
            id: 2,
            filename: "your-paper.pdf",
            title: {
                zh: "论文中文标题",
                en: "Paper English Title"
            },
            authors: "Author Names",
            keywords: {
                zh: ["关键词1", "关键词2"],
                en: ["keyword1", "keyword2"]
            },
            abstract: {
                zh: "中文摘要...",
                en: "English abstract..."
            }
        },
        */
    ];

    // =============================================================
    //  语言切换
    // =============================================================
    function switchLang(lang) {
        currentLang = lang;
        document.documentElement.lang = (lang === "zh") ? "zh-CN" : "en";

        // 更新语言按钮状态
        document.getElementById("btn-zh").classList.toggle("active", lang === "zh");
        document.getElementById("btn-en").classList.toggle("active", lang === "en");

        // 更新所有带有 data-i18n 属性的元素文本
        document.querySelectorAll("[data-i18n]").forEach(el => {
            const key = el.getAttribute("data-i18n");
            if (i18n[lang][key]) {
                el.textContent = i18n[lang][key];
            }
        });

        // 更新所有带有 data-i18n-placeholder 属性的 input placeholder
        document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
            const key = el.getAttribute("data-i18n-placeholder");
            if (i18n[lang][key]) {
                el.placeholder = i18n[lang][key];
            }
        });

        // 更新页面标题
        document.title = i18n[lang].pageTitle;

        // 重新渲染论文列表
        renderPapers();

        // 更新搜索框的 placeholder（因为它是动态的）
        updateSearchPlaceholder();
    }

    function updateSearchPlaceholder() {
        const input = document.getElementById("searchInput");
        input.placeholder = i18n[currentLang].searchPlaceholder;
    }

    // =============================================================
    //  论文过滤（搜索）
    // =============================================================
    function filterPapers() {
        renderPapers();
    }

    function getFilteredPapers() {
        const query = document.getElementById("searchInput").value.trim().toLowerCase();
        if (!query) return papers;

        return papers.filter(p => {
            // 搜索标题（中英文）
            if (p.title.zh.toLowerCase().includes(query)) return true;
            if (p.title.en.toLowerCase().includes(query)) return true;
            // 搜索作者
            if (p.authors.toLowerCase().includes(query)) return true;
            // 搜索关键词（中英文）
            if (p.keywords.zh.some(k => k.toLowerCase().includes(query))) return true;
            if (p.keywords.en.some(k => k.toLowerCase().includes(query))) return true;
            // 搜索摘要
            if (p.abstract.zh.toLowerCase().includes(query)) return true;
            if (p.abstract.en.toLowerCase().includes(query)) return true;
            return false;
        });
    }

    // =============================================================
    //  渲染论文列表
    // =============================================================
    function renderPapers() {
        const filtered = getFilteredPapers();
        const listEl = document.getElementById("paperList");
        const emptyEl = document.getElementById("emptyState");

        // 更新统计文本
        const statsText = i18n[currentLang].stats.replace("{count}", papers.length);
        document.getElementById("statsText").textContent = statsText;

        if (filtered.length === 0) {
            listEl.innerHTML = "";
            emptyEl.style.display = "block";
            return;
        }

        emptyEl.style.display = "none";
        listEl.innerHTML = filtered.map(p => {
            const title = p.title[currentLang];
            const keywords = p.keywords[currentLang];
            const btnPreview = i18n[currentLang].btnPreview;
            const btnDownload = i18n[currentLang].btnDownload;
            const pdfPath = "pdf/" + encodeURIComponent(p.filename);

            return `
                <div class="paper-card">
                    <div class="paper-title">${escapeHtml(title)}</div>
                    <div class="paper-meta">${escapeHtml(p.authors)}</div>
                    <div class="paper-tags">
                        ${keywords.map(k => `<span class="tag">${escapeHtml(k)}</span>`).join("")}
                    </div>
                    <div class="paper-actions">
                        <button class="btn btn-preview" onclick='openPreview("${escapeAttr(pdfPath)}", "${escapeAttr(title)}")'>
                            👁 ${btnPreview}
                        </button>
                        <a class="btn btn-download" href="${escapeAttr(pdfPath)}" download>
                            ⬇ ${btnDownload}
                        </a>
                    </div>
                </div>
            `;
        }).join("");
    }

    // =============================================================
    //  PDF 预览
    // =============================================================
    function openPreview(pdfPath, title) {
        document.getElementById("previewTitle").textContent = title;
        document.getElementById("previewFrame").src = pdfPath;
        document.getElementById("previewOverlay").classList.add("show");
        document.body.style.overflow = "hidden";
    }

    function closePreview(event) {
        // 如果点击的是遮罩层（即 .preview-overlay 自身），则关闭
        if (event && event.target !== document.getElementById("previewOverlay")) return;
        document.getElementById("previewOverlay").classList.remove("show");
        document.getElementById("previewFrame").src = "";
        document.body.style.overflow = "";
    }

    // 按 ESC 关闭预览
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") closePreview();
    });

    // =============================================================
    //  辅助函数：防止 XSS
    // =============================================================
    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    function escapeAttr(str) {
        return str.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // =============================================================
    //  初始化：页面加载完毕后渲染
    // =============================================================
    document.addEventListener("DOMContentLoaded", function() {
        renderPapers();
    });
</script>

</body>
</html>
