<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文分享（中英对照翻译版）</title>

    <!-- ============================================================ -->
    <!--  样式表：CSS 变量集中管理，方便后续调整风格                   -->
    <!-- ============================================================ -->
    <style>
        /* ---------- 全局变量 ---------- */
        :root {
            --bg:           #fafafa;
            --text:         #333333;
            --text-light:   #777777;
            --accent:       #1a1a2e;
            --card-bg:      #ffffff;
            --card-shadow:  0 2px 12px rgba(0, 0, 0, 0.06);
            --card-hover:   0 4px 20px rgba(0, 0, 0, 0.10);
            --radius:       12px;
            --max-width:    880px;

        }

        /* ---------- 基础重置 ---------- */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                         sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            display: flex;
            justify-content: center;
            padding: 32px 20px 80px;
            /* 移动端：去掉点击时的灰色高亮块，禁止横向溢出 */
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
        }

        .container { width: 100%; max-width: var(--max-width); }

        /* ============================================================
           顶部栏：返回主页 + 标题
           ============================================================ */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-link {
            position: absolute;
            left: 0;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        @media (hover: hover) {
            .back-link:hover { color: var(--accent); }
        }

        .site-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .title-group {
            text-align: center;
        }

        .powered-by {
            font-size: 0.82rem;
            color: #999;
            margin-top: 2px;
        }
        .powered-by a {
            color: #777;
            text-decoration: none;
            transition: color 0.2s;
        }
        .powered-by a:hover { color: #555; }


        /* ============================================================
           搜索栏
           ============================================================ */
        .search-section {
            margin-bottom: 32px;
        }
        .search-wrapper {
            position: relative;
            max-width: 480px;
        }
        .search-wrapper input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: var(--radius);
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        .search-wrapper input:focus { border-color: var(--accent); }
        .search-wrapper .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
        }
        .search-hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 6px;
        }

        /* ============================================================
           分类筛选标签
           ============================================================ */
        .filter-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .filter-tab {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.88rem;
            cursor: pointer;
            border: 2px solid #e5e7eb;
            background: var(--card-bg);
            color: var(--text-light);
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        @media (hover: hover) {
            .filter-tab:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
        }
        .filter-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ============================================================
           子分类徽章
           ============================================================ */
        .paper-card .paper-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .paper-card .paper-award-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .badge-best-paper { background: #fef3c7; color: #92400e; }
        .badge-best-theme { background: #ede9fe; color: #5b21b6; }
        .badge-best-resource { background: #dbeafe; color: #1e40af; }
        .badge-best-social-impact { background: #d1fae5; color: #065f46; }
        .badge-outstanding { background: #f3f4f6; color: #374151; }
        .badge-srw-best-paper { background: #fce7f3; color: #9d174d; }

        /* ============================================================
           统计信息
           ============================================================ */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        /* ============================================================
           论文卡片列表
           ============================================================ */
        .paper-list { display: flex; flex-direction: column; gap: 16px; }

        .paper-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--card-shadow);
            transition: box-shadow 0.25s, transform 0.25s;
        }
        /* 悬停效果只在真正支持悬停的设备启用，避免触屏点击后样式粘滞 */
        @media (hover: hover) {
            .paper-card:hover {
                box-shadow: var(--card-hover);
                transform: translateY(-2px);
            }
        }

        .paper-card .paper-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
            overflow-wrap: anywhere;   /* 英文长标题不撑破卡片 */
        }
        .paper-card .paper-title-zh {
            font-size: 0.9rem;
            color: var(--text-light);
            margin-bottom: 8px;
            line-height: 1.5;
        }


        /* 操作按钮 */
        .paper-card .paper-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .paper-card .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-preview {
            background: var(--accent);
            color: #fff;
        }
        .btn-download {
            background: #f3f4f6;
            color: var(--text);
        }
        @media (hover: hover) {
            .btn-preview:hover { opacity: 0.85; }
            .btn-download:hover { background: #e5e7eb; }
        }

        /* ============================================================
           PDF 预览弹窗
           ============================================================ */
        .preview-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .preview-overlay.show {
            display: flex;
        }
        .preview-modal {
            background: #fff;
            border-radius: var(--radius);
            width: 100%;
            max-width: 900px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
        }
        .preview-header .preview-title {
            font-weight: 600;
            color: var(--accent);
            font-size: 1rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
            min-width: 0;
        }
        /* 弹窗右侧操作区：新标签页打开 + 关闭 */
        .preview-header .preview-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-shrink: 0;
            margin-left: 12px;
        }
        .preview-open {
            font-size: 0.82rem;
            color: var(--text-light);
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.2s;
        }
        @media (hover: hover) {
            .preview-open:hover { color: var(--accent); }
            .preview-close:hover { color: var(--text); }
        }
        .preview-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            padding: 0 8px;
            line-height: 1;
        }
        .preview-body {
            flex: 1;
            min-height: 0;
        }
        .preview-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ============================================================
           空状态
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* ============================================================
           页脚
           ============================================================ */
        .footer {
            text-align: center;
            font-size: 0.8rem;
            color: #ccc;
            margin-top: 56px;
        }
        .footer a { color: #bbb; text-decoration: none; }
        .footer a:hover { color: var(--accent); }

        /* ---------- 响应式（移动端阅读体验优化） ---------- */
        @media (max-width: 600px) {
            body { padding: 20px 14px 56px; }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
                margin-bottom: 26px;
            }
            .back-link { position: static; margin-bottom: 10px; }
            .site-title { font-size: 1.2rem; line-height: 1.45; }

            /* 搜索框：16px 字号可避免 iOS 聚焦时页面自动放大 */
            .search-section { margin-bottom: 22px; }
            .search-wrapper { max-width: 100%; }
            .search-wrapper input { font-size: 16px; padding: 12px 42px 12px 14px; }

            /* 筛选标签：等宽平铺，触摸目标更大 */
            .filter-tabs { gap: 8px; margin-bottom: 18px; }
            .filter-tab {
                flex: 1;
                min-width: 0;
                padding: 10px 8px;
                text-align: center;
                font-size: 0.85rem;
            }

            .stats-bar { margin-bottom: 14px; font-size: 0.85rem; }

            .paper-list { gap: 12px; }
            .paper-card { padding: 16px; }
            .paper-card .paper-title { font-size: 1.02rem; line-height: 1.5; }
            .paper-card .paper-title-zh { font-size: 0.86rem; margin-bottom: 12px; }

            /* 操作按钮：各占一半宽度，保证 44px 可点高度 */
            .paper-card .paper-actions { gap: 8px; }
            .paper-card .btn {
                flex: 1;
                justify-content: center;
                min-height: 44px;
                font-size: 0.9rem;
                padding: 8px 10px;
            }

            /* 预览弹窗：移动端已改为新标签页阅读，此处仅作兜底全屏样式 */
            .preview-overlay { padding: 0; }
            .preview-modal {
                max-width: 100%;
                height: 100vh;
                height: 100dvh;
                border-radius: 0;
            }
            .preview-header { padding: 12px 14px; }
            .preview-header .preview-title { font-size: 0.9rem; }

            .footer { margin-top: 40px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ============================================================ -->
    <!--  顶部栏：返回链接 + 标题                                     -->
    <!-- ============================================================ -->
    <div class="top-bar">
        <a class="back-link" href="../">← 返回主页</a>
        <div class="title-group">
            <h1 class="site-title">📄 论文分享（中英对照翻译版）</h1>
            <p class="powered-by">Powered by <a href="https://pdf.baimiaoapp.com/" target="_blank" rel="noopener">白描pdf</a></p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!--  搜索栏                                                     -->
    <!-- ============================================================ -->
    <div class="search-section">
        <div class="search-wrapper">
            <input type="text" id="searchInput"
                   placeholder="搜索论文标题..."
                   oninput="filterPapers()">
            <span class="search-icon">🔍</span>
        </div>
        <p class="search-hint">支持按论文中/英文标题检索</p>
    </div>

    <!-- ============================================================ -->
    <!--  分类筛选标签                                               -->
    <!-- ============================================================ -->
    <div class="filter-tabs" id="filterTabs">
        <button class="filter-tab active" data-filter="all" onclick="setFilter('all')">📚 全部论文</button>
        <button class="filter-tab" data-filter="acl-2026-award" onclick="setFilter('acl-2026-award')">🏆 ACL 2026 Award</button>
    </div>

    <!-- ============================================================ -->
    <!--  统计信息                                                   -->
    <!-- ============================================================ -->
    <div class="stats-bar">
        <span id="statsText">共 2 篇论文</span>
    </div>

    <!-- ============================================================ -->
    <!--  论文列表容器                                               -->
    <!-- ============================================================ -->
    <div id="paperList" class="paper-list">
        <!-- JS 动态渲染 -->
    </div>

    <!-- ============================================================ -->
    <!--  空状态（搜索无结果时显示）                                  -->
    <!-- ============================================================ -->
    <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-icon">📭</div>
        <p>没有找到匹配的论文，试试其他关键词吧</p>
    </div>

    <!-- ============================================================ -->
    <!--  页脚                                                       -->
    <!-- ============================================================ -->
    <footer class="footer">
        <p>
            © 2026 Duan Yu ·
            Powered by
            <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a>
        </p>
    </footer>

</div><!-- .container -->

<!-- ================================================================ -->
<!--  PDF 预览弹窗                                                    -->
<!-- ================================================================ -->
<div id="previewOverlay" class="preview-overlay" onclick="closePreview(event)">
    <div class="preview-modal" onclick="event.stopPropagation()">
        <div class="preview-header">
            <span class="preview-title" id="previewTitle"></span>
            <div class="preview-actions">
                <a class="preview-open" id="previewOpenLink" href="" target="_blank" rel="noopener">↗ 新标签页打开</a>
                <button class="preview-close" onclick="closePreview()">&times;</button>
            </div>
        </div>
        <div class="preview-body" id="previewBody">
            <iframe id="previewFrame" src="" allowfullscreen></iframe>
        </div>
    </div>
</div>

    // =============================================================
    //  当前筛选状态
    // =============================================================
    let currentFilter = "all";  // "all" | "acl-2026-award"

    // =============================================================
    //  阅读方式判定
    //  移动端（iOS / Android / iPad）的 iframe 无法正常渲染与滚动 PDF，
    //  改为直接用系统自带的 PDF 阅读器在新标签页打开，体验更好。
    // =============================================================
    function useNativeViewer() {
        const ua = navigator.userAgent;
        const isIOS = /iPhone|iPad|iPod/i.test(ua)
            || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);  // iPadOS 伪装成桌面 UA
        const isAndroid = /Android/i.test(ua);
        const isNarrow = window.matchMedia("(max-width: 700px)").matches;
        return isIOS || isAndroid || isNarrow;
    }

    // =============================================================
    //  论文过滤（搜索 + 分类筛选）
    // =============================================================
    function filterPapers() {
        renderPapers();
    }

    function getFilteredPapers() {
        const query = document.getElementById("searchInput").value.trim().toLowerCase();

        let pool = papers;
        // 分类筛选
        if (currentFilter !== "all") {
            pool = pool.filter(p => p.category === currentFilter);
        }

        // 搜索过滤（同时匹配英文和中文标题）
        if (!query) return pool;
        return pool.filter(p => {
            if (p.title.toLowerCase().includes(query)) return true;
            if (p.title_zh && p.title_zh.includes(query)) return true;
            return false;
        });
    }

    // =============================================================
    //  分类筛选切换
    // =============================================================
    function setFilter(filterName) {
        currentFilter = filterName;

        // 更新标签页激活状态
        document.querySelectorAll(".filter-tab").forEach(tab => {
            tab.classList.toggle("active", tab.dataset.filter === filterName);
        });

        // 更新 URL 参数（不刷新页面）
        const url = new URL(window.location);
        if (filterName === "all") {
            url.searchParams.delete("filter");
        } else {
            url.searchParams.set("filter", filterName);
        }
        window.history.replaceState({}, "", url);

        // 更新页面标题
        updatePageTitle();

        // 清空搜索框并重新渲染
        document.getElementById("searchInput").value = "";
        renderPapers();
    }

    // =============================================================
    //  从 URL 读取筛选参数
    // =============================================================
    function getFilterFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get("filter") || "all";
    }

    // =============================================================
    //  更新页面标题和 h1
    // =============================================================
    function updatePageTitle() {
        const h1 = document.querySelector(".site-title");
        if (currentFilter === "acl-2026-award") {
            document.title = "ACL 2026 Award 论文（中英对照翻译版）";
            h1.textContent = "🏆 ACL 2026 Award 论文";
        } else {
            document.title = "论文分享（中英对照翻译版）";
            h1.textContent = "📄 论文分享（中英对照翻译版）";
        }
    }

    // =============================================================
    //  渲染论文列表（UI 文本使用中文，标题显示英文原名）
    // =============================================================
    function renderPapers() {
        const filtered = getFilteredPapers();
        const listEl = document.getElementById("paperList");
        const emptyEl = document.getElementById("emptyState");

        // 当前筛选下的论文池
        const pool = currentFilter === "all" ? papers : papers.filter(p => p.category === currentFilter);

        // 更新统计文本
        if (currentFilter === "acl-2026-award") {
            document.getElementById("statsText").textContent = "ACL 2026 Award · 共 " + pool.length + " 篇论文";
        } else {
            document.getElementById("statsText").textContent = "共 " + pool.length + " 篇论文";
        }

        if (filtered.length === 0) {
            listEl.innerHTML = "";
            emptyEl.style.display = "block";
            return;
        }

        emptyEl.style.display = "none";
        const nativeViewer = useNativeViewer();

        listEl.innerHTML = filtered.map(p => {
            const title = p.title;
            const pdfPath = "pdf/" + encodeURIComponent(p.filename);

            // 子分类徽章
            let badgeHtml = "";
            if (p.subcategory) {
                const badgeClass = "badge-" + p.subcategory.toLowerCase().replace(/\s+/g, "-");
                badgeHtml = `<span class="paper-award-badge ${badgeClass}">${escapeHtml(p.subcategory)}</span>`;
            }

            // 阅读按钮：移动端直接新标签页打开，桌面端用弹窗内嵌预览
            const readBtnHtml = nativeViewer
                ? `<a class="btn btn-preview" href="${escapeAttr(pdfPath)}" target="_blank" rel="noopener">
                       📖 阅读
                   </a>`
                : `<button class="btn btn-preview" onclick='openPreview("${escapeAttr(pdfPath)}", "${escapeAttr(title)}")'>
                       👁 预览
                   </button>`;

            return `
                <div class="paper-card">
                    ${badgeHtml ? `<div class="paper-meta">${badgeHtml}</div>` : ""}
                    <div class="paper-title">${escapeHtml(title)}</div>
                    ${p.title_zh ? `<div class="paper-title-zh">${escapeHtml(p.title_zh)}</div>` : ""}
                    <div class="paper-actions">
                        ${readBtnHtml}
                        <a class="btn btn-download" href="${escapeAttr(pdfPath)}" download>
                            ⬇ 下载 PDF
                        </a>
                    </div>
                </div>
            `;
        }).join("");
    }

    // =============================================================
    //  PDF 预览（仅桌面端）
    // =============================================================
    function openPreview(pdfPath, title) {
        document.getElementById("previewTitle").textContent = title;
        document.getElementById("previewFrame").src = pdfPath;
        document.getElementById("previewOpenLink").href = pdfPath;
        document.getElementById("previewOverlay").classList.add("show");
        document.body.style.overflow = "hidden";
    }

    function closePreview(event) {
        // 如果点击的是遮罩层（即 .preview-overlay 自身），则关闭
        if (event && event.target !== document.getElementById("previewOverlay")) return;
        document.getElementById("previewOverlay").classList.remove("show");
        document.getElementById("previewFrame").src = "";
        document.body.style.overflow = "";
    }

    // 按 ESC 关闭预览
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") closePreview();
    });

    // =============================================================
    //  辅助函数：防止 XSS
    // =============================================================
    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    function escapeAttr(str) {
        return str.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // =============================================================
    //  初始化：页面加载完毕后渲染
    // =============================================================
    document.addEventListener("DOMContentLoaded", function() {
        // 从 URL 读取筛选参数
        currentFilter = getFilterFromURL();

        // 初始化标签页激活状态
        document.querySelectorAll(".filter-tab").forEach(tab => {
            tab.classList.toggle("active", tab.dataset.filter === currentFilter);
        });

        // 更新页面标题
        updatePageTitle();

        // 渲染论文列表
        renderPapers();
    });

    // =============================================================
    //  窗口宽度变化（如横竖屏切换）时重新判定阅读方式
    // =============================================================
    let resizeTimer = null;
    window.addEventListener("resize", function() {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(renderPapers, 200);
    });
</script>
