<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>论文分享（中英对照翻译版）</title>

    <!-- ============================================================ -->
    <!--  样式表：CSS 变量集中管理，方便后续调整风格                   -->
    <!-- ============================================================ -->
    <style>
        /* ---------- 全局变量 ---------- */
        :root {
            --bg:           #fafafa;
            --text:         #333333;
            --text-light:   #777777;
            --accent:       #1a1a2e;
            --card-bg:      #ffffff;
            --card-shadow:  0 2px 12px rgba(0, 0, 0, 0.06);
            --card-hover:   0 4px 20px rgba(0, 0, 0, 0.10);
            --radius:       12px;
            --max-width:    880px;

        }

        /* ---------- 基础重置 ---------- */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
                         sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.75;
            display: flex;
            justify-content: center;
            padding: 32px 20px 80px;
        }

        .container { width: 100%; max-width: var(--max-width); }

        /* ============================================================
           顶部栏：返回主页 + 标题
           ============================================================ */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-link {
            position: absolute;
            left: 0;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        .site-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .title-group {
            text-align: center;
        }

        .powered-by {
            font-size: 0.82rem;
            color: #999;
            margin-top: 2px;
        }
        .powered-by a {
            color: #777;
            text-decoration: none;
            transition: color 0.2s;
        }
        .powered-by a:hover { color: #555; }


        /* ============================================================
           搜索栏
           ============================================================ */
        .search-section {
            margin-bottom: 32px;
        }
        .search-wrapper {
            position: relative;
            max-width: 480px;
        }
        .search-wrapper input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: var(--radius);
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        .search-wrapper input:focus { border-color: var(--accent); }
        .search-wrapper .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
        }
        .search-hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 6px;
        }

        /* ============================================================
           统计信息
           ============================================================ */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        /* ============================================================
           论文卡片列表
           ============================================================ */
        .paper-list { display: flex; flex-direction: column; gap: 16px; }

        .paper-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--card-shadow);
            transition: box-shadow 0.25s, transform 0.25s;
        }
        .paper-card:hover {
            box-shadow: var(--card-hover);
            transform: translateY(-2px);
        }

        .paper-card .paper-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 6px;
        }


        /* 操作按钮 */
        .paper-card .paper-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .paper-card .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-preview {
            background: var(--accent);
            color: #fff;
        }
        .btn-preview:hover { opacity: 0.85; }
        .btn-download {
            background: #f3f4f6;
            color: var(--text);
        }
        .btn-download:hover { background: #e5e7eb; }

        /* 下载计数 */
        .paper-card .paper-dl-count {
            margin-top: 12px;
            font-size: 0.82rem;
            color: var(--text-light);
        }
        .paper-card .paper-dl-count strong {
            color: var(--accent);
            font-weight: 600;
        }

        /* ============================================================
           PDF 预览弹窗
           ============================================================ */
        .preview-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .preview-overlay.show {
            display: flex;
        }
        .preview-modal {
            background: #fff;
            border-radius: var(--radius);
            width: 100%;
            max-width: 900px;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
        }
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
        }
        .preview-header .preview-title {
            font-weight: 600;
            color: var(--accent);
            font-size: 1rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 70%;
        }
        .preview-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);
            padding: 0 8px;
            line-height: 1;
        }
        .preview-close:hover { color: var(--text); }
        .preview-body {
            flex: 1;
            min-height: 0;
        }
        .preview-body iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ============================================================
           空状态
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
        }
        .empty-state .empty-icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        /* ============================================================
           页脚
           ============================================================ */
        .footer {
            text-align: center;
            font-size: 0.8rem;
            color: #ccc;
            margin-top: 56px;
        }
        .footer a { color: #bbb; text-decoration: none; }
        .footer a:hover { color: var(--accent); }

        /* ---------- 响应式 ---------- */
        @media (max-width: 600px) {
            body { padding: 24px 14px 60px; }
            .top-bar { flex-direction: column; align-items: center; }
            .back-link { position: static; margin-bottom: 8px; }
            .site-title { font-size: 1.25rem; }
            .paper-card { padding: 18px; }
            .preview-modal { height: 95vh; max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- ============================================================ -->
    <!--  顶部栏：返回链接 + 标题                                     -->
    <!-- ============================================================ -->
    <div class="top-bar">
        <a class="back-link" href="../">← 返回主页</a>
        <div class="title-group">
            <h1 class="site-title">📄 论文分享（中英对照翻译）</h1>
            <p class="powered-by">Powered by <a href="https://pdf.baimiaoapp.com/" target="_blank" rel="noopener">白描pdf</a></p>
        </div>
    </div>

    <!-- ============================================================ -->
    <!--  搜索栏                                                     -->
    <!-- ============================================================ -->
    <div class="search-section">
        <div class="search-wrapper">
            <input type="text" id="searchInput"
                   placeholder="搜索论文标题..."
                   oninput="filterPapers()">
            <span class="search-icon">🔍</span>
        </div>
        <p class="search-hint">支持按论文标题检索</p>
    </div>

    <!-- ============================================================ -->
    <!--  统计信息                                                   -->
    <!-- ============================================================ -->
    <div class="stats-bar">
        <span id="statsText">共 1 篇论文</span>
    </div>

    <!-- ============================================================ -->
    <!--  论文列表容器                                               -->
    <!-- ============================================================ -->
    <div id="paperList" class="paper-list">
        <!-- JS 动态渲染 -->
    </div>

    <!-- ============================================================ -->
    <!--  空状态（搜索无结果时显示）                                  -->
    <!-- ============================================================ -->
    <div id="emptyState" class="empty-state" style="display:none;">
        <div class="empty-icon">📭</div>
        <p>没有找到匹配的论文，试试其他关键词吧</p>
    </div>

    <!-- ============================================================ -->
    <!--  页脚                                                       -->
    <!-- ============================================================ -->
    <footer class="footer">
        <p>
            © 2026 Duan Yu ·
            Powered by
            <a href="https://pages.github.com" target="_blank" rel="noopener">GitHub Pages</a>
        </p>
    </footer>

</div><!-- .container -->

<!-- ================================================================ -->
<!--  PDF 预览弹窗                                                    -->
<!-- ================================================================ -->
<div id="previewOverlay" class="preview-overlay" onclick="closePreview(event)">
    <div class="preview-modal" onclick="event.stopPropagation()">
        <div class="preview-header">
            <span class="preview-title" id="previewTitle"></span>
            <button class="preview-close" onclick="closePreview()">&times;</button>
        </div>
        <div class="preview-body" id="previewBody">
            <iframe id="previewFrame" src="" allowfullscreen></iframe>
        </div>
    </div>
</div>

<!-- ================================================================ -->
<!--  JavaScript: 数据 + 搜索 + 渲染 + 预览                           -->
<!-- ================================================================ -->
<script>

    // =============================================================
    //  论文数据（新增论文只需在此数组中添加对象即可）
    //  字段说明：
    //    - filename:   pdf/ 目录下的文件名
    //    - title:      论文标题（英文）
    // =============================================================
    const papers = [
        {
            filename: "Extracting books from production language models.pdf",
            title: "Extracting Books from Production Language Models"
        }
        // ---- 新增论文模板：复制以下代码块，填入信息即可 ----
        /*
        {
            filename: "your-paper.pdf",
            title: "Paper Title"
        },
        */
    ];

    // =============================================================
    //  下载计数（基于 localStorage 持久化）
    // =============================================================
    function getDownloadCount(filename) {
        const key = "dl_" + filename;
        return parseInt(localStorage.getItem(key) || "0", 10);
    }

    function incrementDownload(filename) {
        const key = "dl_" + filename;
        const count = getDownloadCount(filename) + 1;
        localStorage.setItem(key, count);
        return count;
    }

    function getTotalDownloads() {
        return papers.reduce((sum, p) => sum + getDownloadCount(p.filename), 0);
    }

    // =============================================================
    //  论文过滤（搜索）
    // =============================================================
    function filterPapers() {
        renderPapers();
    }

    function getFilteredPapers() {
        const query = document.getElementById("searchInput").value.trim().toLowerCase();
        if (!query) return papers;

        return papers.filter(p => {
            if (p.title.toLowerCase().includes(query)) return true;
            return false;
        });
    }

    // =============================================================
    //  渲染论文列表（UI 文本使用中文，标题显示英文原名）
    // =============================================================
    function renderPapers() {
        const filtered = getFilteredPapers();
        const listEl = document.getElementById("paperList");
        const emptyEl = document.getElementById("emptyState");

        // 更新统计文本
        const totalDownloads = getTotalDownloads();
        document.getElementById("statsText").textContent = "共 " + papers.length + " 篇论文 · 总计 " + totalDownloads + " 次下载";

        if (filtered.length === 0) {
            listEl.innerHTML = "";
            emptyEl.style.display = "block";
            return;
        }

        emptyEl.style.display = "none";
        listEl.innerHTML = filtered.map(p => {
            const title = p.title;
            const pdfPath = "pdf/" + encodeURIComponent(p.filename);

            const dlCount = getDownloadCount(p.filename);
            return `
                <div class="paper-card">
                    <div class="paper-title">${escapeHtml(title)}</div>
                    <div class="paper-actions">
                        <button class="btn btn-preview" onclick='openPreview("${escapeAttr(pdfPath)}", "${escapeAttr(title)}")'>
                            👁 预览
                        </button>
                        <a class="btn btn-download" href="${escapeAttr(pdfPath)}" download
                           onclick="handleDownload('${escapeAttr(p.filename)}')">
                            ⬇ 下载 PDF
                        </a>
                    </div>
                    <div class="paper-dl-count">📥 已下载 <strong>${dlCount}</strong> 次</div>
                </div>
            `;
        }).join("");
    }

    // =============================================================
    //  PDF 预览
    // =============================================================
    function openPreview(pdfPath, title) {
        document.getElementById("previewTitle").textContent = title;
        document.getElementById("previewFrame").src = pdfPath;
        document.getElementById("previewOverlay").classList.add("show");
        document.body.style.overflow = "hidden";
    }

    function closePreview(event) {
        // 如果点击的是遮罩层（即 .preview-overlay 自身），则关闭
        if (event && event.target !== document.getElementById("previewOverlay")) return;
        document.getElementById("previewOverlay").classList.remove("show");
        document.getElementById("previewFrame").src = "";
        document.body.style.overflow = "";
    }

    // 按 ESC 关闭预览
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") closePreview();
    });

    // =============================================================
    //  辅助函数：防止 XSS
    // =============================================================
    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    function escapeAttr(str) {
        return str.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // =============================================================
    //  下载处理：记录下载次数后刷新 UI
    // =============================================================
    function handleDownload(filename) {
        incrementDownload(filename);
        renderPapers();
    }

    // =============================================================
    //  初始化：页面加载完毕后渲染
    // =============================================================
    document.addEventListener("DOMContentLoaded", function() {
        renderPapers();
    });
</script>

</body>
</html>
