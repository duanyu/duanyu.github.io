        /* ---------- 全局变量 ---------- */
        :root {
            --bg:           #fafafa;
            --text:         #333333;

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

            color: var(--text);
            line-height: 1.75;
            display: flex;
            justify-content: center;
            padding: 32px 20px 80px;
        }

           顶部栏：返回主页 + 标题
           ============================================================ */

            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
            position: relative;
        }

        .back-link {
            position: absolute;
            left: 0;
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--accent); }

        .site-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .title-group {
            text-align: center;
        }

        .powered-by {
            font-size: 0.82rem;
            color: #999;
            margin-top: 2px;
        }
        .powered-by a {
            color: #777;
            text-decoration: none;
            transition: color 0.2s;
        }
        .powered-by a:hover { color: #555; }


        /* ============================================================
           搜索栏
           ============================================================ */
        .search-section {
            margin-bottom: 32px;
        }
        .search-wrapper {
            position: relative;
            max-width: 480px;
        }
        .search-wrapper input {
            width: 100%;
            padding: 12px 44px 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: var(--radius);
            font-size: 0.95rem;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s;
        }
        .search-wrapper input:focus { border-color: var(--accent); }
        .search-wrapper .search-icon {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            pointer-events: none;
        }
        .search-hint {
            font-size: 0.8rem;
            color: var(--text-light);
            margin-top: 6px;
        }

           分类筛选标签
           ============================================================ */

            display: flex;
            gap: 10px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .filter-tab {
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.88rem;
            cursor: pointer;
            border: 2px solid #e5e7eb;
            background: var(--card-bg);
            color: var(--text-light);
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        .filter-tab:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .filter-tab.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ============================================================
           子分类徽章
           ============================================================ */
        .paper-card .paper-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .paper-card .paper-award-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .badge-best-paper { background: #fef3c7; color: #92400e; }
        .badge-best-theme { background: #ede9fe; color: #5b21b6; }
        .badge-best-resource { background: #dbeafe; color: #1e40af; }
        .badge-best-social-impact { background: #d1fae5; color: #065f46; }
        .badge-outstanding { background: #f3f4f6; color: #374151; }
        .badge-srw-best-paper { background: #fce7f3; color: #9d174d; }

           统计信息
           ============================================================ */

            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 0.9rem;
            color: var(--text-light);
        }

           论文卡片列表
           ============================================================ */

        .paper-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--card-shadow);
            transition: box-shadow 0.25s, transform 0.25s;
        }
        .paper-card:hover {
            box-shadow: var(--card-hover);

        .paper-card .paper-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 6px;
        }

            gap: 10px;
            flex-wrap: wrap;

            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: all 0.2s;

            color: #fff;

            color: var(--text);

            color: var(--text-light);

            font-weight: 600;
        }

           ============================================================ */

            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;

        }

            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
        }

            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #eee;
        }

            color: var(--accent);
            font-size: 1rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;

            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-light);

            line-height: 1;

            .site-title { font-size: 1.25rem; }

    // =============================================================
    //  下载计数（基于 localStorage 持久化）
    // =============================================================
    function getDownloadCount(filename) {
        const key = "dl_" + filename;
        return parseInt(localStorage.getItem(key) || "0", 10);
    }

    function incrementDownload(filename) {
        const key = "dl_" + filename;
        const count = getDownloadCount(filename) + 1;
        localStorage.setItem(key, count);
        return count;
    }

    function getTotalDownloads(pool) {
        return (pool || papers).reduce((sum, p) => sum + getDownloadCount(p.filename), 0);
    }

    }

    function getFilteredPapers() {
        const query = document.getElementById("searchInput").value.trim().toLowerCase();

        let pool = papers;
        // 分类筛选
        if (currentFilter !== "all") {
            pool = pool.filter(p => p.category === currentFilter);
        }

        // 搜索过滤
        if (!query) return pool;
        return pool.filter(p => p.title.toLowerCase().includes(query));
    }

    // =============================================================
    //  分类筛选切换
    // =============================================================
    function setFilter(filterName) {
        currentFilter = filterName;

        // 更新标签页激活状态
        document.querySelectorAll(".filter-tab").forEach(tab => {
            tab.classList.toggle("active", tab.dataset.filter === filterName);
        });

        // 更新 URL 参数（不刷新页面）
        const url = new URL(window.location);
        if (filterName === "all") {
            url.searchParams.delete("filter");
        } else {
            url.searchParams.set("filter", filterName);
        }
        window.history.replaceState({}, "", url);

        // 更新页面标题
        updatePageTitle();

        // 清空搜索框并重新渲染
        document.getElementById("searchInput").value = "";
        renderPapers();
    }

    // =============================================================
    //  从 URL 读取筛选参数
    // =============================================================
    function getFilterFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get("filter") || "all";
    }

    // =============================================================
    //  更新页面标题和 h1
    // =============================================================
    function updatePageTitle() {
        const h1 = document.querySelector(".site-title");
        if (currentFilter === "acl-2026-award") {
            document.title = "ACL 2026 Award 论文（中英对照翻译版）";
            h1.textContent = "🏆 ACL 2026 Award 论文";
        } else {
            document.title = "论文分享（中英对照翻译版）";
            h1.textContent = "📄 论文分享（中英对照翻译版）";
        }
    }

    // =============================================================
    //  渲染论文列表（UI 文本使用中文，标题显示英文原名）
    // =============================================================
    function renderPapers() {
        const filtered = getFilteredPapers();
        const listEl = document.getElementById("paperList");
        const emptyEl = document.getElementById("emptyState");

        // 当前筛选下的论文池
        const pool = currentFilter === "all" ? papers : papers.filter(p => p.category === currentFilter);
        const totalDownloads = getTotalDownloads(pool);

        // 更新统计文本
        if (currentFilter === "acl-2026-award") {
            document.getElementById("statsText").textContent = "ACL 2026 Award · 共 " + pool.length + " 篇论文 · 总计 " + totalDownloads + " 次下载";
        } else {
            document.getElementById("statsText").textContent = "共 " + pool.length + " 篇论文 · 总计 " + totalDownloads + " 次下载";
        }

        if (filtered.length === 0) {
            listEl.innerHTML = "";
            emptyEl.style.display = "block";
            return;
        }

        emptyEl.style.display = "none";
        listEl.innerHTML = filtered.map(p => {
            const title = p.title;
            const pdfPath = "pdf/" + encodeURIComponent(p.filename);
            const dlCount = getDownloadCount(p.filename);

            // 子分类徽章
            let badgeHtml = "";
            if (p.subcategory) {
                const badgeClass = "badge-" + p.subcategory.toLowerCase().replace(/\s+/g, "-");
                badgeHtml = `<span class="paper-award-badge ${badgeClass}">${escapeHtml(p.subcategory)}</span>`;
            }

            return `
                <div class="paper-card">
                    ${badgeHtml ? `<div class="paper-meta">${badgeHtml}</div>` : ""}
                    <div class="paper-title">${escapeHtml(title)}</div>
                    <div class="paper-actions">
                        <button class="btn btn-preview" onclick='openPreview("${escapeAttr(pdfPath)}", "${escapeAttr(title)}")'>
                            👁 预览
                        </button>
                        <a class="btn btn-download" href="${escapeAttr(pdfPath)}" download
                           onclick="handleDownload('${escapeAttr(p.filename)}')">
                            ⬇ 下载 PDF
                        </a>
                    </div>
                    <div class="paper-dl-count">📥 已下载 <strong>${dlCount}</strong> 次</div>
                </div>
            `;
        }).join("");
    }

    // =============================================================
    //  PDF 预览
    // =============================================================
    function openPreview(pdfPath, title) {
        document.getElementById("previewTitle").textContent = title;
        document.getElementById("previewFrame").src = pdfPath;
        document.getElementById("previewOverlay").classList.add("show");
        document.body.style.overflow = "hidden";
    }

    function closePreview(event) {
        // 如果点击的是遮罩层（即 .preview-overlay 自身），则关闭
        if (event && event.target !== document.getElementById("previewOverlay")) return;
        document.getElementById("previewOverlay").classList.remove("show");
        document.getElementById("previewFrame").src = "";
        document.body.style.overflow = "";
    }

    // 按 ESC 关闭预览
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") closePreview();
    });

    // =============================================================
    //  辅助函数：防止 XSS
    // =============================================================
    function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
    }

    function escapeAttr(str) {
        return str.replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // =============================================================
    //  下载处理：记录下载次数后刷新 UI
    // =============================================================
    function handleDownload(filename) {
        incrementDownload(filename);
        renderPapers();
    }

    // =============================================================
    //  初始化：页面加载完毕后渲染
    // =============================================================
    document.addEventListener("DOMContentLoaded", function() {
        // 从 URL 读取筛选参数
        currentFilter = getFilterFromURL();

        // 初始化标签页激活状态
        document.querySelectorAll(".filter-tab").forEach(tab => {
            tab.classList.toggle("active", tab.dataset.filter === currentFilter);
        });

        // 更新页面标题
        updatePageTitle();

        // 渲染论文列表
        renderPapers();
    });
</script>

</body>
</html>
